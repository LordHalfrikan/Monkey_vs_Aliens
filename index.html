<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monkey vs Aliens - Choose Your Adventure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="screen-border">
            <div class="screen">
                <canvas id="gameCanvas" width="512" height="384"></canvas>
                <div id="textBox" class="text-box">
                    <p id="storyText"></p>
                </div>
                <div id="choicesBox" class="choices-box"></div>
            </div>
        </div>
        <div class="controls">
            <div class="title">MONKEY VS ALIENS</div>
            <div class="subtitle">A Retro Adventure</div>
        </div>
    </div>
    <script src="graphics.js"></script>
    <script src="game.js"></script>
</body>
</html>
